# TrueNAS multipath profile.
#
# Installed by the truenas-proxmox-plugin package. dpkg treats this as a
# conffile: your local edits survive upgrades (dpkg prompts on conflict).
#
# Everything in /etc/multipath/conf.d/*.conf is processed AFTER
# /etc/multipath.conf, so settings here override a differing device{}
# block in /etc/multipath.conf. If you want a local override that
# survives upgrades without the dpkg prompt, drop a file whose name
# sorts AFTER this one (for example zz-truenas-local.conf) into
# /etc/multipath/conf.d/.
#
# The device{} block follows TrueNAS's own recommendation for ctld-
# served iSCSI targets: ALUA hardware handler and prio, immediate
# failback, and no_path_retry queue so I/O stalls across a TrueNAS HA
# failover window instead of failing out. fast_io_fail_tmo and
# dev_loss_tmo hold a path down long enough for TrueNAS SCALE's
# failover (observed 20-60 s) without giving up.
#
# user_friendly_names and find_multipaths are pinned here so a fresh
# PVE node that has no /etc/multipath.conf of its own still maps our
# devices with stable /dev/mapper/mpathN names.

defaults {
    user_friendly_names yes
    find_multipaths     yes
}

devices {
    device {
        vendor                  "TrueNAS"
        product                 "iSCSI Disk"
        path_grouping_policy    group_by_prio
        hardware_handler        "1 alua"
        prio                    alua
        path_checker            tur
        failback                immediate
        no_path_retry           queue
        fast_io_fail_tmo        10
        dev_loss_tmo            30
    }
}
